name: Verify R2 Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to mirror before verification
        required: false
        default: ''
      manifest_url:
        description: Public release manifest URL to verify
        required: false
        default: https://download.most.box/releases/latest.json
      bucket:
        description: R2 release bucket
        required: false
        default: most-box-releases
      expected_latest_cache_control:
        description: Expected Cache-Control for releases/latest.json
        required: false
        default: public, max-age=60, stale-while-revalidate=300
      expected_asset_cache_control:
        description: Expected Cache-Control for versioned release assets
        required: false
        default: public, max-age=31536000, immutable

permissions:
  contents: read

jobs:
  verify-r2-release:
    name: Verify R2 release metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configure verification target
        run: |
          release_tag="$INPUT_RELEASE_TAG"
          bucket="${INPUT_BUCKET:-most-box-releases}"
          manifest_url="$INPUT_MANIFEST_URL"

          if [ -n "$release_tag" ]; then
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid release tag: $release_tag"
              exit 1
            fi
            if [ "$bucket" = "most-box-backup" ]; then
              echo "::error::The backup bucket cannot be used for public release assets"
              exit 1
            fi

            public_base_url="${SECRET_R2_PUBLIC_BASE_URL:-}"
            if [ -z "$public_base_url" ]; then
              case "$manifest_url" in
                */releases/latest.json)
                  public_base_url="${manifest_url%/releases/latest.json}"
                  ;;
                *)
                  echo "::error::manifest_url must end with /releases/latest.json when R2_PUBLIC_BASE_URL is unset"
                  exit 1
                  ;;
              esac
            fi
            public_base_url="${public_base_url%/}"
            manifest_url="$public_base_url/releases/latest.json"
            echo "R2_PUBLIC_BASE_URL=$public_base_url" >> "$GITHUB_ENV"
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "R2_RELEASE_BUCKET=$bucket" >> "$GITHUB_ENV"
          echo "MANIFEST_URL=$manifest_url" >> "$GITHUB_ENV"
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_BUCKET: ${{ inputs.bucket }}
          INPUT_MANIFEST_URL: ${{ inputs.manifest_url }}
          SECRET_R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

      - name: Validate R2 credentials
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Install project dependencies
        if: ${{ inputs.release_tag != '' }}
        run: npm ci

      - name: Download GitHub release assets
        if: ${{ inputs.release_tag != '' }}
        run: gh release download "$RELEASE_TAG" --dir release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create release manifest
        if: ${{ inputs.release_tag != '' }}
        run: |
          node scripts/create-release-manifest.mjs \
            --assets release-assets \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --base-url "$R2_PUBLIC_BASE_URL"

      - name: Install AWS CLI
        run: |
          python -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload release assets to R2
        if: ${{ inputs.release_tag != '' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

          node - <<'NODE' > release-asset-files.txt
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('release-assets/latest.json', 'utf8'))
          const files = [...new Set(manifest.assets.map(item => item.filename))]
          if (files.length !== 7) {
            throw new Error(`Expected 7 release installers, found ${files.length}`)
          }
          process.stdout.write(`${files.join('\n')}\n`)
          NODE

          while IFS= read -r asset_file; do
            aws --endpoint-url "$endpoint" s3 cp \
              "release-assets/$asset_file" \
              "s3://$R2_RELEASE_BUCKET/releases/$RELEASE_TAG/$asset_file" \
              --storage-class STANDARD \
              --cache-control "$EXPECTED_ASSET_CACHE_CONTROL"
          done < release-asset-files.txt

          aws --endpoint-url "$endpoint" s3 cp \
            release-assets/latest.json \
            "s3://$R2_RELEASE_BUCKET/releases/latest.json" \
            --storage-class STANDARD \
            --content-type "application/json; charset=utf-8" \
            --cache-control "$EXPECTED_LATEST_CACHE_CONTROL"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          EXPECTED_LATEST_CACHE_CONTROL: ${{ inputs.expected_latest_cache_control }}
          EXPECTED_ASSET_CACHE_CONTROL: ${{ inputs.expected_asset_cache_control }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Wait for public release manifest
        if: ${{ inputs.release_tag != '' }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --header "Cache-Control: no-cache" \
              "$MANIFEST_URL" \
              --output release-manifest-candidate.json; then
              manifest_state="$(node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('release-manifest-candidate.json', 'utf8')); process.stdout.write(String(manifest.version || '') + ':' + String(Array.isArray(manifest.assets) ? manifest.assets.length : 0))")"
              if [ "$manifest_state" = "${expected_version}:7" ]; then
                mv release-manifest-candidate.json release-manifest.json
                exit 0
              fi
              echo "Attempt $attempt: expected ${expected_version}:7, received ${manifest_state:-unknown}"
            fi
            sleep 10
          done

          echo "::error::Public release manifest did not refresh to $expected_version"
          exit 1

      - name: Download public release manifest
        if: ${{ inputs.release_tag == '' }}
        run: curl --fail --location --silent --show-error "$MANIFEST_URL" --output release-manifest.json

      - name: Verify public release CORS
        run: node scripts/verify-release-cors.mjs --url "$MANIFEST_URL"

      - name: Verify R2 storage class and cache metadata
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

          node - <<'NODE'
          const { spawnSync } = require('child_process')
          const fs = require('fs')

          const manifest = JSON.parse(fs.readFileSync('release-manifest.json', 'utf8'))
          const bucket = process.env.R2_RELEASE_BUCKET || 'most-box-releases'
          const expectedLatestCacheControl = process.env.EXPECTED_LATEST_CACHE_CONTROL
          const expectedAssetCacheControl = process.env.EXPECTED_ASSET_CACHE_CONTROL
          const endpoint = process.env.R2_ENDPOINT

          function getObjectKeyFromUrl(value) {
            if (typeof value !== 'string' || value.length === 0) return null
            return decodeURIComponent(new URL(value).pathname.replace(/^\/+/, ''))
          }

          const targets = new Map()
          targets.set('releases/latest.json', {
            kind: 'manifest',
            expectedCacheControl: expectedLatestCacheControl,
          })

          for (const asset of manifest.assets || []) {
            const key = getObjectKeyFromUrl(asset.r2Url)
            if (!key) continue
            targets.set(key, {
              kind: asset.kind || 'asset',
              expectedCacheControl: expectedAssetCacheControl,
            })
          }

          if (targets.size <= 1) {
            throw new Error('No R2 release assets found in release manifest')
          }

          const rows = []
          for (const [key, target] of targets) {
            const result = spawnSync(
              'aws',
              [
                '--endpoint-url',
                endpoint,
                's3api',
                'head-object',
                '--bucket',
                bucket,
                '--key',
                key,
              ],
              { encoding: 'utf8' }
            )

            if (result.status !== 0) {
              rows.push({
                key,
                status: 'failed',
                storageClass: '',
                cacheControl: '',
                expectedCacheControl: target.expectedCacheControl,
                error: result.stderr.trim() || `aws exited with ${result.status}`,
              })
              continue
            }

            const meta = JSON.parse(result.stdout)
            const storageClass = meta.StorageClass || 'STANDARD'
            const cacheControl = meta.CacheControl || ''
            rows.push({
              key,
              status:
                storageClass === 'STANDARD' &&
                cacheControl === target.expectedCacheControl
                  ? 'ok'
                  : 'failed',
              storageClass,
              cacheControl,
              expectedCacheControl: target.expectedCacheControl,
              error: '',
            })
          }

          const summary = [
            '# R2 release verification',
            '',
            `Manifest version: ${manifest.version || 'unknown'}`,
            '',
            `Bucket: ${bucket}`,
            '',
            '| Object | Storage class | Cache-Control | Expected Cache-Control | Result |',
            '| --- | --- | --- | --- | --- |',
          ]

          for (const row of rows) {
            summary.push(
              `| \`${row.key}\` | ${row.storageClass || '-'} | \`${row.cacheControl || '-'}\` | \`${row.expectedCacheControl}\` | ${row.status} |`
            )
            if (row.error) {
              summary.push(`| \`${row.key}\` | - | - | - | ${row.error.replaceAll('|', '\\|')} |`)
            }
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`)

          const failures = rows.filter(row => row.status !== 'ok')
          if (failures.length > 0) {
            for (const row of failures) {
              console.error(
                `${row.key} failed: storage=${row.storageClass || '-'}, cache=${row.cacheControl || '-'}`
              )
            }
            process.exit(1)
          }
          NODE
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          EXPECTED_LATEST_CACHE_CONTROL: ${{ inputs.expected_latest_cache_control }}
          EXPECTED_ASSET_CACHE_CONTROL: ${{ inputs.expected_asset_cache_control }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
