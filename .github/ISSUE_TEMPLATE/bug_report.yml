name: Bug 报告

description: 报告 Bug 帮助我们改进

title: '[Bug] '

body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写此 Bug 报告！

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰简洁地描述 Bug 是什么。
      placeholder: 在此描述 Bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 复现 Bug 的步骤。
      placeholder: |
        1. 进入 '...'
        2. 点击 '....'
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么。
      placeholder: 描述你期望的行为...

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么。
      placeholder: 描述实际发生的行为...

  - type: input
    id: version
    attributes:
      label: 版本
      description: 请填写 MostBox 版本号；源码运行请填写 commit SHA。
      placeholder: 例如 0.4.7 或 d0686a8
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - 其他

  - type: dropdown
    id: network
    attributes:
      label: 网络环境
      options:
        - 同一局域网
        - 不同公网网络
        - VPN / 代理环境
        - 无法确定

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息
      description: 请提供相关 CID、节点状态、topic join 状态或错误码；不要提交私人文件或凭证。

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请包含相关错误消息或日志，并删除私钥、助记词、token、邀请码和本地敏感路径。
      placeholder: 在此粘贴你的日志...
